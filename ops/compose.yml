# Yard's own project. The apply container is not a service here.
services:
  app:
    image: ${IMAGE}
    pull_policy: never
    build:
      context: ${CHECKOUT}
      dockerfile: ops/Containerfile
    restart: always
    networks:
      - yard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${YARD_ROOT}:${YARD_ROOT}
      - ${YARD_PODMAN_SOCK}:/run/podman/podman.sock
      - ${DATA_DIR}:/data
      # Container logs live in the journal; Yard reads them for the API.
      - /var/log/journal:/var/log/journal:ro
      # Yard's own events go to journald through the native socket.
      - /run/systemd/journal/socket:/run/systemd/journal/socket
    # The yard app's env file. install.sh runs this before Yard has written it.
    env_file:
      - path: ${APP_ENV}
        required: false
    environment:
      SHA: ${SHA}
      IMAGE: ${IMAGE}
      YARD_ROOT: ${YARD_ROOT}
      YARD_PODMAN_SOCK: ${YARD_PODMAN_SOCK}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    # No healthcheck. A recurring probe burns CPU and fills the log.

  caddy:
    image: docker.io/library/caddy:2
    restart: always
    networks:
      - yard
    ports:
      - "8443:8443"
    volumes:
      - ${YARD_ROOT}/apps/yard/caddy/config:/config
      - ${YARD_ROOT}/apps/yard/caddy/data:/data
      - ${YARD_ROOT}/apps/yard/caddy/run:/run/caddy
      - ${CHECKOUT}/ops/caddy.json:/etc/caddy/yard.json:ro
    # The admin socket. A resumed autosave has no admin block, so the env wins.
    environment:
      CADDY_ADMIN: unix//run/caddy/admin.sock
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/yard.json", "--resume"]

networks:
  yard:
    external: true
    name: yard

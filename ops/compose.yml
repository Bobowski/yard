# Yard's own project. The apply container is not a service here.
services:
  app:
    image: ${IMAGE}
    pull_policy: never
    build:
      context: ${CHECKOUT}
      dockerfile: ops/Containerfile
    restart: always
    networks:
      yard:
        aliases:
          - yard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${YARD_ROOT}:${YARD_ROOT}
      - ${YARD_PODMAN_SOCK}:/run/podman/podman.sock
      - ${DATA_DIR}:/data
    # The yard slot's env file. install.sh runs this before Yard has written it.
    env_file:
      - path: ${APP_ENV}
        required: false
    environment:
      SHA: ${SHA}
      IMAGE: ${IMAGE}
      YARD_ROOT: ${YARD_ROOT}
      YARD_PODMAN_SOCK: ${YARD_PODMAN_SOCK}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    # No healthcheck: apply probes http://yard:8000/ after up, and a 2s probe
    # would burn CPU and fill the log with /health spans forever.

  caddy:
    image: docker.io/library/caddy:2
    restart: always
    networks:
      - yard
    ports:
      - "8443:8443"
    volumes:
      - ${YARD_ROOT}/projects/yard/caddy/config:/config
      - ${YARD_ROOT}/projects/yard/caddy/data:/data
      - ${CHECKOUT}/ops/caddy.json:/etc/caddy/yard.json:ro
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/yard.json", "--resume"]

networks:
  yard:
    external: true
    name: yard

# Yard's own project. The apply container is not a service here.
services:
  yard:
    image: ${IMAGE}
    pull_policy: never
    build:
      context: ${CHECKOUT}
      dockerfile: ops/Containerfile
    container_name: yard
    restart: always
    networks:
      yard:
        aliases:
          - yard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${YARD_ROOT}:${YARD_ROOT}
      - ${YARD_PODMAN_SOCK}:/run/podman/podman.sock
      - ${DATA_DIR}:/data
    # The yard slot's env file. install.sh runs this before Yard has written it.
    env_file:
      - path: ${APP_ENV}
        required: false
    environment:
      SHA: ${SHA}
      IMAGE: ${IMAGE}
      YARD_ROOT: ${YARD_ROOT}
      YARD_PODMAN_SOCK: ${YARD_PODMAN_SOCK}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    healthcheck:
      test:
        [
          "CMD",
          "/workspace/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: always
    networks:
      - yard
    ports:
      - "8443:8443"
    volumes:
      - ${YARD_ROOT}/data/caddy:/config/caddy
      - ${YARD_ROOT}/data/caddy/lib:/data
      - ${YARD_ROOT}/run:/run/caddy
      - ${CHECKOUT}/ops/caddy.json:/etc/caddy/caddy.json:ro
    entrypoint: ["caddy"]
    # --resume prefers the autosave Yard pushes; the file is the first start.
    command: ["run", "--config", "/etc/caddy/caddy.json", "--resume"]

networks:
  yard:
    external: true
    name: yard

# Yard's own project. The apply container is not a service here.
services:
  yard:
    image: ${IMAGE}
    pull_policy: never
    build:
      context: ${CHECKOUT}
      dockerfile: ops/Containerfile
    container_name: yard
    restart: always
    networks:
      yard:
        aliases:
          - yard
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${YARD_ROOT}:${YARD_ROOT}
      - ${YARD_PODMAN_SOCK}:/run/podman/podman.sock
      - ${DATA_DIR}:/data
    # The yard slot's env file. install.sh runs this before Yard has written it.
    env_file:
      - path: ${APP_ENV}
        required: false
    environment:
      SHA: ${SHA}
      IMAGE: ${IMAGE}
      YARD_ROOT: ${YARD_ROOT}
      YARD_PODMAN_SOCK: ${YARD_PODMAN_SOCK}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    # Podman joins a CMD healthcheck through a shell, so no semicolons. curl is in the image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: always
    networks:
      - yard
    ports:
      - "8443:8443"
    volumes:
      - ${YARD_ROOT}/data/caddy:/config/caddy
      - ${YARD_ROOT}/data/caddy/lib:/data
      - ${YARD_ROOT}/run:/run/caddy
    entrypoint: ["caddy"]
    # The seed file lives inside the /run/caddy mount: a file bind source that
    # goes missing becomes an empty directory on the host.
    command: ["run", "--config", "/run/caddy/caddy.json", "--resume"]

networks:
  yard:
    external: true
    name: yard

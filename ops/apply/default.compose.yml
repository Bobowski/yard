# A repo that has a Containerfile and no compose file. Yard uses this file as it is.
services:
  app:
    build:
      context: ${CHECKOUT}
      dockerfile: ${DOCKERFILE:-Containerfile}
    image: ${IMAGE}
    pull_policy: never
    restart: always
    networks:
      yard:
        aliases:
          - ${SLOT_NAME}
    volumes:
      - ${DATA_DIR}:/data
    env_file:
      - ${APP_ENV}
    environment:
      SLOT_NAME: ${SLOT_NAME}
      SLOT_DATA_DIR: /data
      SHA: ${SHA}
      PORT: "8000"
    expose:
      - "8000"
networks:
  yard:
    external: true
    name: yard

# Every app's base compose: service app on the yard network with its data and env.
# A build overlay adds build.compose.yml for the kinds Yard builds itself.
services:
  app:
    image: ${IMAGE}
    restart: always
    networks:
      yard:
        aliases:
          - ${PROJECT_NAME}
    volumes:
      - ${DATA_DIR}:/data
    env_file:
      - ${APP_ENV}
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_DATA_DIR: /data
      SHA: ${SHA}
networks:
  yard:
    external: true
    name: yard

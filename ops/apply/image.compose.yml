# A repo-less app that runs the image as its publisher built it. The bind names its port.
services:
  app:
    image: ${IMAGE}
    restart: always
    networks:
      yard:
        aliases:
          - ${PROJECT_NAME}
    volumes:
      - ${DATA_DIR}:/data
    env_file:
      - ${APP_ENV}
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_DATA_DIR: /data
      SHA: ${SHA}
networks:
  yard:
    external: true
    name: yard

# One apply container. Podman names it. The command is up, build, start, revert, job, or purge.
name: yard-apply
services:
  apply:
    image: localhost/yard-apply:5.3.1
    pull_policy: never
    build:
      context: .
      dockerfile: Containerfile
    network_mode: none
    volumes:
      - ${YARD_PODMAN_SOCK}:/run/podman/podman.sock
      - ${YARD_ROOT}:${YARD_ROOT}
    environment:
      DOCKER_HOST: unix:///run/podman/podman.sock
      COMPOSE_PROJECT_NAME: ${YARD_PROJECT}
      COMPOSE_FILE: ${YARD_COMPOSE}
      COMPOSE_ENV_FILE: ${YARD_APP_ENV}
      SERVICE: app
      YARD_SLOT: ${YARD_SLOT:-}
      YARD_SHA: ${YARD_SHA:-}
      YARD_DEFAULT_COMPOSE: ${YARD_DEFAULT_COMPOSE:-}
      DATA_DIR: ${YARD_DATA_DIR:-}
      IMAGE: ${YARD_IMAGE:-}
    labels:
      yard.role: ${YARD_ROLE:-}
      yard.slot: ${YARD_SLOT:-}
      yard.sha: ${YARD_SHA:-}

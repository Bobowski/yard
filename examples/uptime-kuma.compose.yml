# Uptime Kuma: a self-hosted status monitor. https://github.com/louislam/uptime-kuma
# yard app new --runs https://raw.githubusercontent.com/stariodev/yard/main/examples/uptime-kuma.compose.yml --public <host>
services:
  app:
    image: docker.io/louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    restart: always
    networks:
      - yard
    volumes:
      - ${DATA_DIR}:/app/data
    env_file:
      - ${APP_ENV}
    expose:
      - "3001"
networks:
  yard:
    external: true
    name: yard

name: image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/bobowski/yard:latest
            ghcr.io/bobowski/yard:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

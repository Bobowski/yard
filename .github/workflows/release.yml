name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --extra server --locked
      - run: uv run ruff check app tests
      - run: uv run pyright
      - run: uv run pytest

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/staryard
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Check the tag matches the package version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$ver\"" pyproject.toml
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
